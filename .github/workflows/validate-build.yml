name: Validate Jekyll Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --trace
        env:
          JEKYLL_ENV: production
      - name: Verify generated output
        run: |
          set -e
          echo "== generated pages =="
          find _site -name "*.html" | sort
          echo
          echo "== publication links in index.html =="
          grep -o 'href="[^"]*publication[^"]*"' _site/index.html | sort -u
          echo
          echo "== placeholder leftovers =="
          if grep -rn "Paper Title Number" _site/ ; then echo "FOUND PLACEHOLDER"; exit 1; else echo "none"; fi
          if grep -rn "Your Name" _site/ ; then echo "FOUND PLACEHOLDER NAME"; exit 1; else echo "none"; fi
          if grep -rn "academicpages.github.io" _site/index.html ; then echo "FOUND TEMPLATE URL"; exit 1; else echo "none"; fi
          echo
          echo "== sidebar author block =="
          grep -o 'author__[a-z]*"[^>]*>[^<]*' _site/index.html | head -40
          echo
          echo "== title/head =="
          grep -o '<title>[^<]*</title>' _site/index.html
          echo
          echo "== publications page content =="
          grep -o '\(Preprints\|Conference Papers\|SynLogic\|Perception Bottleneck\|Universal Truthfulness\|In-Context Sharpness\|C-Eval\|Composing Parameter-Efficient\)[^<]*' _site/publications/index.html | sort -u
          echo
          echo "== number of generated publication pages =="
          find _site/publication -maxdepth 2 -name index.html | sort
