name: Validate Jekyll Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --trace
        env:
          JEKYLL_ENV: production
      - name: Show key output
        run: |
          ls -la _site/
          echo "--- index.html (head) ---"
          head -c 3000 _site/index.html
          echo ""
          echo "--- publications index ---"
          head -c 3000 _site/publications/index.html
          echo ""
          echo "--- search for placeholder strings ---"
          grep -rn "Paper Title Number" _site/ || echo "no placeholder publication titles found"
