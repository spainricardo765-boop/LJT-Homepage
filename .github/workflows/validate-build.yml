name: Validate Jekyll Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage" --trace
        env:
          JEKYLL_ENV: production
      - name: Verify generated output
        run: |
          set -e
          echo "== publication links in index.html =="
          grep -o 'href="[^"]*publication[^"]*"' _site/index.html | sort -u
          echo
          echo "== placeholder check (index/publications/cv) =="
          grep -c "Paper Title Number" _site/index.html _site/publications/index.html _site/cv/index.html || true
          grep -c "Your Name" _site/index.html _site/publications/index.html _site/cv/index.html || true
          echo
          echo "== sidebar author block =="
          grep -o '<h3 class="author__name">[^<]*</h3>' _site/index.html
          grep -o '<p class="author__bio">[^<]*</p>' _site/index.html
          grep -o '<a href="mailto:[^"]*"' _site/index.html
          grep -o 'github.com/[A-Za-z0-9_-]*' _site/index.html | sort -u
          grep -o 'twitter.com/[A-Za-z0-9_-]*' _site/index.html | sort -u
          echo
          echo "== title =="
          grep -o '<title>[^<]*</title>' _site/index.html
          echo
          echo "== publications page headings/venues =="
          grep -o '\(Preprints\|Conference Papers\|Published in <i>[^<]*</i>\)' _site/publications/index.html | sort -u
          echo
          echo "== generated publication detail pages =="
          find _site/publication -name index.html | sort
          echo
          echo "== masthead nav links =="
          grep -o '<a href="[^"]*" class="[^"]*site-nav[^"]*"' _site/index.html | sort -u || true
          sed -n '/masthead/,/\/nav/p' _site/index.html | grep -o 'href="[^"]*"' | sort -u | head -20
          echo
          echo "== cv page sections =="
          grep -o '<h2>[^<]*</h2>' _site/cv/index.html || true
          echo
          echo "== cv publication list =="
          grep -o 'href="[^"]*publication[^"]*"' _site/cv/index.html | sort -u
